version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: bookstore_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root          # Password untuk user root
      MYSQL_DATABASE: bookstore_db       # Nama database yang otomatis dibuat
    ports:
      - "3306:3306"                      # Port akses database
    volumes:
      - mysql_data:/var/lib/mysql        # Agar data tidak hilang saat PC dimatikan

volumes:
  mysql_data: